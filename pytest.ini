[pytest]
testpaths = tests
filterwarnings =
    ignore::DeprecationWarning:joblib.*
    ignore::DeprecationWarning:langsmith.*
    ignore::pytest.PytestRemovedIn10Warning:anyio.*
    ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning
    ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning

